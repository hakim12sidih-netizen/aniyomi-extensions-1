name: Build Franime Repo

on:
  push:
    branches: [ extensions-aniyomi-1, master, main ]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Franime only (skip lint)
      run: ./gradlew :src:fr:franime:assembleDebug -x lintKotlin --stacktrace

    - name: Collect APKs
      run: |
        mkdir -p ~/apk-artifacts
        find src/fr/franime -path "*/build/outputs/apk/debug/*.apk" -exec cp {} ~/apk-artifacts/ \;
        ls -la ~/apk-artifacts

    - name: Create repo artifacts
      run: |
        python ./.github/scripts/move-built-apks.py
        INSPECTOR_LINK="$(curl -s "https://api.github.com/repos/komikku-app/aniyomi-extensions-inspector/releases/latest" | jq -r '.assets[0].browser_download_url')"
        curl -L "$INSPECTOR_LINK" -o ./Inspector.jar
        java -jar ./Inspector.jar "repo/apk" "output.json" "tmp"
        python ./.github/scripts/create-repo.py

    - name: Publish repo branch
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git fetch origin repo || true
        if git show-ref --verify --quiet refs/remotes/origin/repo; then
          git checkout -B repo origin/repo
        else
          git checkout --orphan repo
        fi

        find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
        cp -a repo/. .

        git add -A
        git commit -m "Update repo" || echo "No changes to commit"
        git push origin repo --force
